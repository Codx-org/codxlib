# Pinned to 61.1.0 deliberately: later 61.1.x builds (verified through 61.1.9) ship
# binary patches for net.minecraft.network.codec.ByteBufCodecs that are inconsistent with
# loom's merged 1.21.11 jar — ByteBufCodecs$11 keeps its (int) constructor but the patched
# <clinit> calls the no-arg one, so the dev server dies at vanilla startup with
# "NoSuchMethodError: ByteBufCodecs$11.<init>()" before any mod loads. 61.1.0's patches are
# self-consistent. Only affects the dev runServer; the built jar runs on any Forge 61.x.
