# CodxLib — Stonecutter central config. Single source of truth for node versions.
#
# NOTE (step 3): the fabric-api / neoforge version pins below are APPROXIMATE and
# must be verified before a node actually builds. deps.minecraft values are exact.
# TODO(publishing/step 4): mod.group="codx" gives the correct source package
#   (codx.codxlib.*), but confirm the maven publish group stays "codx.codxlib" so
#   consumer coordinates (codx.codxlib:codxlib-*) don't change.
# TODO: confirm codxlib's actual license (placeholder MIT below).

loomx.loom_version = "1.16-SNAPSHOT"

mod.id = "codxlib"
mod.name = "CodxLib"
mod.group = "codx"
mod.version = "1.6.1"
mod.description = "Shared library for codx mods (Fabric, Forge, NeoForge)"
mod.authors = ["codx"]
mod.license.name = "MIT"
mod.license.url = "https://opensource.org/licenses/MIT"
mod.sources_url = "https://github.com/Codx-org/codxlib"
mod.homepage_url = "https://modrinth.com/mod/codxlib"
mod.issues_url = "https://github.com/Codx-org/codxlib/issues"
mod.inception_year = "2025"

[fabric]
# BUILD-TIME loader pin only (what dev runs / the compile classpath use). One recent
# loader for all nodes; it is MC-version-independent, so it also runs the 1.20.x/1.21.x
# nodes. This must NOT leak into the shipped manifest — see deps.fabric-loader-min.
deps.fabric-loader = "0.19.3"

# Each [fabric."<mc>"] section carries deps.fabric-loader-min: the loader floor DECLARED
# in that node's fabric.mod.json. It is deliberately per-MC-version and set to exactly
# what that node's pinned Fabric API already requires (read out of each fabric-api jar's
# own fabric.mod.json), so we add no restriction beyond what fabric-api enforces anyway.
# Do NOT collapse this back to a single global value: doing so once shipped every node
# with ">=0.19.3", which rejected the loader builds launchers install for older MC
# ("requires version 0.19.3 or later ... but only 0.18.1 is present").
# There is intentionally no global fallback here, so a new node missing the key fails
# the build loudly instead of silently inheriting a wrong floor.

# Each section ALSO carries deps.fabric-api-min: the Fabric API floor DECLARED in that
# node's fabric.mod.json, as opposed to deps.fabric-api, which is the BUILD-TIME pin
# (compile classpath + dev runs). Same split, same reason: emitting the pin as the
# declared range forbids every OLDER build of the same Fabric API line, so a player who
# needs 0.92.8 on 1.20.1 (because a later build breaks another mod) cannot run CodxLib
# at all -- and because consumers hard-depend on codxlib, that floor is transitive and
# overrides whatever floor THEY declare. Set each value to the oldest build of that
# line CodxLib is actually known to work against; equal to the pin where unmeasured.
# No global fallback, for the same reason as above.

[fabric."1.20.1"]
deps.minecraft = "1.20.1"
deps.fabric-api = "0.92.11+1.20.1"
deps.fabric-api-min = "0.92.8+1.20.1"
deps.fabric-loader-min = "0.16.10"

