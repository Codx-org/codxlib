# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
# arch-loom provisions MC on the daemon JVM, so it must be >= the highest node's Java. 26.x
# needs Java 25 (sandbox has 26, which arch-loom accepts as >=25). User: a Java 25 or 26 JDK.
# Per-node compile JVMs (17/21/25) still come from toolchains.
org.gradle.java.home=/usr/lib/jvm/java-26-openjdk

# Mod Info
mod_id=codxlib
mod_name=CodxLib
mod_version=1.3.2
mod_group=codx.codxlib
mod_author=codx
mod_description=Shared library for codx mods (Fabric, Forge, NeoForge)
slug=codxlib

# Minecraft
# Java Edition latest naming scheme
minecraft_version=26.1.2
minecraft_version_range=[26.1, 26.1.3)
minecraft_version_fabric_range=>=26.1 <=26.1.2
java_version=25

# NeoForm version for common project (see https://projects.neoforged.net/neoforged/neoform)
neo_form_version=26.1.2-1

# Fabric
yarn_mappings=1.21.11+build.5
fabric_loader_version=0.18.6
fabric_version=0.145.4+26.1.2

# NeoForge
neoforge_version=26.1.2.7-beta
neoforge_loader_version_range=[4,)

# Forge
forge_version=64.0.5
forge_loader_version_range=[64,)
